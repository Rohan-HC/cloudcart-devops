spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudcart_products
    username: cloudcart
    password: cloudcart
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8082
