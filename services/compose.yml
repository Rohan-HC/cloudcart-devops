name: cloudcart
services:

  user-db:
    image: postgres:15.4
    container_name: user-db
    environment:
      POSTGRES_DB: cloudcart
      POSTGRES_USER: cloudcart
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudcart}
    ports:
      - "5432:5432"
    networks:
      - cloudcart-network
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-db:
    image: postgres:15.4
    container_name: product-db
    environment:
      POSTGRES_DB: cloudcart_products
      POSTGRES_USER: cloudcart
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudcart}
    ports:
      - "5433:5432"
    networks:
      - cloudcart-network
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-db:
    image: postgres:15.4
    container_name: order-db
    environment:
      POSTGRES_DB: cloudcart_orders
      POSTGRES_USER: cloudcart
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudcart}
    ports:
      - "5434:5432"
    networks:
      - cloudcart-network
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: cloudcart-user-service:1.0.0
    container_name: user-service
    environment:
      - DB_URL=jdbc:postgresql://user-db:5432/cloudcart
      - DB_USERNAME=cloudcart
      - DB_PASSWORD=${DB_PASSWORD:-cloudcart}
      - JWT_SECRET=${JWT_SECRET:-cloudcart-development-jwt-secret-key-must-be-at-least-32-bytes-long}
      - JWT_EXPIRATION_MINUTES=60
      - JPA_DDL_AUTO=update
      - SERVER_PORT=8081
    ports:
      - "8081:8081"
    networks:
      - cloudcart-network
    depends_on:
      user-db:
        condition: service_healthy

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    image: cloudcart-product-service:1.0.0
    container_name: product-service
    environment:
      - DB_URL=jdbc:postgresql://product-db:5432/cloudcart_products
      - DB_USERNAME=cloudcart
      - DB_PASSWORD=${DB_PASSWORD:-cloudcart}
      - JPA_DDL_AUTO=update
      - SERVER_PORT=8082
    ports:
      - "8082:8082"
    networks:
      - cloudcart-network
    depends_on:
      product-db:
        condition: service_healthy

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: cloudcart-order-service:1.0.0
    container_name: order-service
    environment:
      - DB_URL=jdbc:postgresql://order-db:5432/cloudcart_orders
      - DB_USERNAME=cloudcart
      - DB_PASSWORD=${DB_PASSWORD:-cloudcart}
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - JPA_DDL_AUTO=update
      - SERVER_PORT=8083
    ports:
      - "8083:8083"
    networks:
      - cloudcart-network
    depends_on:
      order-db:
        condition: service_healthy

  payment-service:
    build:
      context: ./payment-service
      dockerfile: dockerfile

    image: cloudcart-payment-service:1.0.0
    container_name: payment-service

    environment:
      PORT: 8084
      NODE_ENV: production

    ports:
      - "8084:8084"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8084/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - cloudcart-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    image: cloudcart-notification-service:1.0.0
    container_name: notification-service

    environment:
      PORT: 8085
      NODE_ENV: production

    ports:
      - "8085:8085"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8085/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - cloudcart-network



volumes:
  user-db-data:
  product-db-data:
  order-db-data:

networks:
  cloudcart-network:
    driver: bridge
