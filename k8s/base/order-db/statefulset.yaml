apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-db
  namespace: cloudcart
  labels:
    app.kubernetes.io/name: order-db
    app.kubernetes.io/part-of: cloudcart
spec:
  serviceName: order-db
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: order-db

  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-db
        app.kubernetes.io/part-of: cloudcart

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: postgres
          image: postgres:15.4
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: cloudcart_orders

            - name: POSTGRES_USER
              value: cloudcart

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
